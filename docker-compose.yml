version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: accredify_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-accredify_db}
      POSTGRES_USER: ${DB_USER:-accredify_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password must be set in .env file}
    # Do not expose Postgres publicly; only accessible to other containers on the Docker network.
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-accredify_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accredify_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn accredify_backend.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-accredify_user}:${DB_PASSWORD:?Database password required}@db:5432/${DB_NAME:-accredify_db}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-172.237.95.120,localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://172.237.95.120,http://localhost:3000,http://localhost:5173}
    # Do not expose Django publicly; it is served via the nginx reverse proxy on :80.
    # ports:
    #   - "8000:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # python:3.11-slim image doesn't include curl by default; use Python to perform the health check.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/health/').read(); sys.exit(0)\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend (Development)
  # NOTE: not used for production. Leaving it disabled by default to avoid exposing :3000 publicly.
  # To use locally, uncomment this service and run without the nginx production profile.
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.frontend
  #   container_name: accredify_frontend
  #   restart: unless-stopped
  #   environment:
  #     - VITE_API_URL=${VITE_API_URL:-http://172.237.95.120/api}
  #     - GEMINI_API_KEY=${GEMINI_API_KEY}
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #   depends_on:
  #     - backend

  # Nginx Reverse Proxy (Production)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: accredify_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # HTTP-only deployment (per requirement). Enable 443 only when you have real TLS configured.
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - ./dist:/var/www/html:ro
      # Mount cert directory (rw so the container can generate a self-signed cert if empty)
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    profiles:
      - production

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: accredify_redis
    restart: unless-stopped
    # Do not expose Redis publicly.
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: accredify_network
